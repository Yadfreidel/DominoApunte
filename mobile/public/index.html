<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: la app ocupa también la zona de la muesca y la barra inferior del iPhone;
         los márgenes seguros los aplica la propia app (react-native-safe-area-context). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- App web instalable: al agregarla a la pantalla de inicio se abre a pantalla completa, sin barras del navegador. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dominó" />
    <meta name="application-name" content="Dominó" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050a24" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- Reinicio de estilos recomendado por react-native-web. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Fondo de la app en toda la página: así las barras del navegador y las zonas
         fuera del contenido se ven del mismo azul marino y no en blanco. -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #050a24;
        color-scheme: dark;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* Foco visible para teclado en toda la app (no depende solo del color: contorno grueso). */
      :focus-visible {
        outline: 3px solid var(--domino-focus, #c6f432);
        outline-offset: 2px;
      }
      /* Transiciones suaves de color al pasar el cursor o cambiar de estado. */
      [role='button'],
      [role='tab'],
      [role='link'],
      [role='menuitem'],
      [role='radio'],
      [role='checkbox'],
      [role='switch'],
      input,
      textarea {
        transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, opacity 0.18s ease;
      }
      @media (hover: hover) {
        [role='button']:hover,
        [role='tab']:hover,
        [role='menuitem']:hover {
          filter: brightness(1.12);
        }
      }
      /* Respeta la preferencia del sistema de reducir el movimiento. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <!-- Tema global guardado: se aplica al fondo antes de cargar la app para evitar destellos. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('domino:appearance') || 'null');
        var hex = /^#[0-9A-Fa-f]{6}$/;
        if (t && t.colors && hex.test(t.colors.background) && hex.test(t.colors.primary)) {
          document.documentElement.style.backgroundColor = t.colors.background;
          document.documentElement.style.setProperty('--domino-focus', t.colors.primary);
          var bg = document.createElement('style');
          bg.textContent = 'html,body{background-color:' + t.colors.background + '}';
          document.head.appendChild(bg);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', t.colors.background);
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para usar esta app.</noscript>
    <div id="root"></div>
  </body>
</html>
